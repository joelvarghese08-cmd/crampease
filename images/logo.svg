<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fbb"/>
      <stop offset="1" stop-color="#e8457f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fa5"/>
      <stop offset="1" stop-color="#b06cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#fff1f5"/>

  <!-- flower mark: five soft petals hugging a warm centre -->
  <g transform="translate(200 200)">
    <circle r="150" fill="#ffe3ec"/>
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-62" rx="42" ry="62"/>
      <ellipse cx="0" cy="-62" rx="42" ry="62" transform="rotate(72)"/>
      <ellipse cx="0" cy="-62" rx="42" ry="62" transform="rotate(144)"/>
      <ellipse cx="0" cy="-62" rx="42" ry="62" transform="rotate(216)"/>
      <ellipse cx="0" cy="-62" rx="42" ry="62" transform="rotate(288)"/>
    </g>
    <circle r="34" fill="#fff3a8"/>
    <path d="M0 12 C-14 -2 -26 -14 -14 -24 C-6 -30 0 -22 0 -18 C0 -22 6 -30 14 -24 C26 -14 14 -2 0 12 Z" fill="#e8457f"/>
  </g>

  <!-- wordmark -->
  <text x="390" y="225" font-family="Georgia, 'Playfair Display', serif" font-size="128" font-weight="700" fill="#4a2340">Cramp<tspan font-style="italic" fill="url(#word)">Ease</tspan></text>
  <text x="394" y="290" font-family="'Segoe UI', Quicksand, Arial, sans-serif" font-size="31" letter-spacing="7" fill="#8a6680">COMFORT FOR YOUR HARD DAYS</text>
</svg>
